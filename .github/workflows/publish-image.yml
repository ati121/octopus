name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: latest
      version:
        description: Application version
        required: true
        default: v2.0.0

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          NEXT_PUBLIC_APP_VERSION="${{ inputs.version }}" \
          NEXT_PUBLIC_GITHUB_REPO="https://github.com/${{ github.repository }}" \
          pnpm build

      - name: Embed frontend
        run: |
          rm -rf static/out
          mv web/out static/out

      - name: Build Linux binaries
        run: |
          set -e
          BUILD_TIME="$(TZ='Asia/Shanghai' date +'%F %T %z')"
          COMMIT_ID="$(git rev-parse --short HEAD)"
          LDFLAGS="-X 'github.com/bestruirui/octopus/internal/conf.Version=${{ inputs.version }}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.BuildTime=${BUILD_TIME}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Author=ati121' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Commit=${COMMIT_ID}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Repo=https://github.com/${{ github.repository }}' \
                   -s -w"
          mkdir -p build/docker/linux/amd64 build/docker/linux/arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags=jsoniter -ldflags="${LDFLAGS}" -o build/docker/linux/amd64/octopus .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags=jsoniter -ldflags="${LDFLAGS}" -o build/docker/linux/arm64/octopus .

      - name: Package corresponding source
        run: |
          bash scripts/package-source.sh
          mkdir -p build/source-check
          tar -xzf build/source/octopus-source.tar.gz -C build/source-check
          test "$(cat build/source-check/SOURCE_REVISION.txt)" = "$(git rev-parse HEAD)"
          test -s build/source-check/vendor/github.com/looplj/axonhub/llm/LICENSE
          test -s build/source-check/licenses/LGPL-3.0.txt
          test -s build/source-check/licenses/GPL-3.0.txt
          cd build/source-check
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -tags=jsoniter -o ../source-check-binary .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify images before publishing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker build --platform "linux/$arch" --build-arg TARGETPLATFORM="linux/$arch" \
              -f scripts/dockerfiles/Dockerfile.debian -t "octopus:verify-$arch" .
            docker run --rm --platform "linux/$arch" --entrypoint /app/octopus \
              "octopus:verify-$arch" version | tee "build/version-$arch.txt"
            grep -F "Version: $RELEASE_VERSION" "build/version-$arch.txt"
            docker run --rm --platform "linux/$arch" --entrypoint /bin/sh "octopus:verify-$arch" -ec '
              test -s /usr/share/doc/octopus/THIRD_PARTY_NOTICES.md
              test -s /usr/share/doc/octopus/licenses/LGPL-3.0.txt
              tar -tzf /usr/share/doc/octopus/octopus-source.tar.gz > /tmp/source-files
              grep -Fx "./vendor/github.com/looplj/axonhub/llm/LICENSE" /tmp/source-files
            '
          done

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/dockerfiles/Dockerfile.debian
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag }}
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
          build-args: |
            TARGETPLATFORM
          provenance: false
