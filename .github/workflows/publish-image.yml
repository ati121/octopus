name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Application version
        required: true
        default: v0.8.41

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          NEXT_PUBLIC_APP_VERSION="${{ inputs.version }}" \
          NEXT_PUBLIC_GITHUB_REPO="https://github.com/${{ github.repository }}" \
          pnpm build

      - name: Embed frontend
        run: |
          rm -rf static/out
          mv web/out static/out

      - name: Build Linux binaries
        run: |
          set -e
          BUILD_TIME="$(TZ='Asia/Shanghai' date +'%F %T %z')"
          COMMIT_ID="$(git rev-parse --short HEAD)"
          LDFLAGS="-X 'github.com/bestruirui/octopus/internal/conf.Version=${{ inputs.version }}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.BuildTime=${BUILD_TIME}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Author=tianxia3111' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Commit=${COMMIT_ID}' \
                   -X 'github.com/bestruirui/octopus/internal/conf.Repo=https://github.com/${{ github.repository }}' \
                   -s -w"
          mkdir -p build/docker/linux/amd64 build/docker/linux/arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags=jsoniter -ldflags="${LDFLAGS}" -o build/docker/linux/amd64/octopus .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags=jsoniter -ldflags="${LDFLAGS}" -o build/docker/linux/arm64/octopus .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/dockerfiles/Dockerfile.debian
          platforms: linux/amd64,linux/arm64
          push: true
          tags: tianxia311/octopus:latest
          build-args: |
            TARGETPLATFORM
          provenance: false
